[pytest]
addopts = -ra
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = .
# Scripts auxiliares importados por tests (importar_productos_excel, csv_bundle, etc.)
pythonpath = . scripts
# Un test colgado falla a los 120 s en vez de trabar toda la suite (pytest-timeout).
timeout = 120
filterwarnings =
    ignore::DeprecationWarning
