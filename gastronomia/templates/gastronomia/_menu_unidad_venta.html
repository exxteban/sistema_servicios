{# Venta por peso (Fase 2 pasteleria): solo se muestra con el flag de root encendido. #}
<label class="col-span-2 block text-sm font-semibold text-gray-700 dark:text-gray-200">
    Se vende por
    <select name="unidad_venta"
            class="mt-1 w-full rounded-lg border border-gray-200 px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100">
        <option value="unidad">Unidad (precio por pieza)</option>
        <option value="kg">Kilo (el precio es por kg; el peso se carga al vender)</option>
    </select>
    <span class="mt-0.5 block text-xs font-medium text-gray-500 dark:text-gray-400">
        Por kilo: sin promociones. La receta descuenta una pieza estándar sin importar el peso.
    </span>
</label>
