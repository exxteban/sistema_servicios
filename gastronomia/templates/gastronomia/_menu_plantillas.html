<div data-entry-tab-panel="plantilla" class="hidden" role="tabpanel">
    <script type="application/json" id="gastro-menu-plantillas-data">{{ menu_plantillas|tojson }}</script>
    <div id="gastro-plantillas" data-puede-promos="{{ '1' if puede_gestionar_promociones else '0' }}" class="space-y-4 rounded-xl border border-gray-200 bg-white p-5 shadow-sm dark:border-gray-700 dark:bg-gray-800">
        <div>
            <h2 class="text-base font-semibold text-gray-900 dark:text-white">Arranca rapido con una plantilla</h2>
            <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">Elegi tu rubro, marca lo que vendes y escribi el precio. Despues podes cambiar o borrar todo cuando quieras.</p>
        </div>

        <div>
            <p class="text-xs font-bold uppercase tracking-wide text-gray-500 dark:text-gray-400">1. Que tipo de local tenes?</p>
            <div data-plantilla-rubros class="mt-2 grid grid-cols-2 gap-2 sm:grid-cols-3"></div>
        </div>

        <div data-plantilla-paso2 class="hidden space-y-3">
            <div>
                <p class="text-xs font-bold uppercase tracking-wide text-gray-500 dark:text-gray-400">2. Marca lo que vendes y pone el precio</p>
                <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Podes cambiarle el nombre a cualquier producto. Los que destildes no se cargan.</p>
            </div>
            <div data-plantilla-lista class="space-y-4"></div>
            <div data-plantilla-promo class="hidden">
                <label class="flex items-start gap-3 rounded-lg border border-amber-200 bg-amber-50 p-3 text-sm dark:border-amber-400/30 dark:bg-amber-500/10">
                    <input type="checkbox" data-plantilla-promo-check checked class="mt-0.5 h-5 w-5">
                    <span>
                        <span class="block font-bold text-gray-900 dark:text-white"><i class="fas fa-tags mr-1 text-amber-600"></i>Crear tambien la promo <span data-plantilla-promo-nombre></span></span>
                        <span class="mt-0.5 block text-xs text-gray-600 dark:text-gray-300">Queda pausada por 30 dias. La activas cuando quieras desde Menu cargado &rarr; Promociones.</span>
                    </span>
                </label>
            </div>
            <div class="sticky bottom-0 -mx-5 -mb-5 rounded-b-xl border-t border-gray-200 bg-white p-4 dark:border-gray-700 dark:bg-gray-800">
                <button type="button" data-plantilla-aplicar
                        class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-emerald-600 px-4 py-3 text-sm font-bold text-white hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-50">
                    <i class="fas fa-magic"></i><span data-plantilla-aplicar-texto>Cargar productos</span>
                </button>
            </div>
        </div>
    </div>
</div>
