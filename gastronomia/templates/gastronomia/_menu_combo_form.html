<div data-promo-paso="combo" class="hidden space-y-4">
    <div>
        <p class="text-sm font-semibold text-gray-700 dark:text-gray-200">Que incluye el combo?</p>
        <div data-combo-incluidos class="mt-2 space-y-2"></div>
        <input data-combo-buscar type="search" placeholder="Buscar otro producto para sumar (ej: papas)" class="gastro-template-input mt-2" aria-label="Buscar producto para el combo">
        <div data-combo-resultados class="mt-1 space-y-1"></div>
    </div>

    <div class="rounded-lg border border-gray-200 p-3 dark:border-gray-700">
        <label class="flex items-center gap-2 text-sm font-semibold text-gray-700 dark:text-gray-200">
            <input type="checkbox" data-combo-bebida-check class="h-5 w-5">
            Dejar que el cliente elija la bebida
        </label>
        <div data-combo-bebidas class="mt-2 hidden">
            <p class="text-xs text-gray-500 dark:text-gray-400">Tilda las bebidas que puede elegir. En el POS se pide elegir una.</p>
            <div data-combo-bebidas-lista class="mt-2 grid gap-1 sm:grid-cols-2"></div>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
        <div class="rounded-lg bg-gray-50 p-3 text-sm dark:bg-gray-900/40">
            <p class="text-xs font-semibold text-gray-500 dark:text-gray-400">Por separado</p>
            <p data-combo-separado class="text-lg font-bold text-gray-900 dark:text-white">Gs. 0</p>
        </div>
        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-200">
            Precio del combo
            <input data-combo-precio type="text" inputmode="decimal" placeholder="Gs." class="gastro-template-input mt-1">
        </label>
    </div>
    <p data-combo-ahorro class="hidden text-sm font-bold text-emerald-700 dark:text-emerald-300"></p>

    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-200">
        Nombre del combo
        <input data-combo-nombre type="text" maxlength="160" class="gastro-template-input mt-1">
        <span class="mt-1 block text-xs font-medium text-gray-500 dark:text-gray-400">Asi lo ven la caja y la cocina. Queda en la categoria "Combos".</span>
    </label>

    <p data-combo-aviso class="hidden rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-xs font-semibold text-amber-800 dark:border-amber-400/30 dark:bg-amber-500/10 dark:text-amber-200"></p>

    <button type="button" data-combo-guardar class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-emerald-600 px-4 py-3 text-sm font-bold text-white hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-50">
        <i class="fas fa-layer-group"></i><span data-combo-guardar-texto>Crear combo</span>
    </button>
</div>
