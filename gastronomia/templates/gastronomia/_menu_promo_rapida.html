{# Modal "Hacer promo": promo rapida sobre un producto o combo con otros productos. #}
<script type="application/json" id="gastro-promo-productos-data">{{ menu_productos_combo|tojson }}</script>
<div id="gastro-promo-modal" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true" aria-labelledby="gastro-promo-titulo"
     data-cliente-id="{{ promociones_cliente_gastronomia_id }}"
     data-puede-promos="{{ '1' if puede_gestionar_promociones else '0' }}">
    <div class="fixed inset-0 bg-gray-900/60" data-promo-cerrar></div>
    <div class="fixed inset-0 overflow-y-auto">
        <div class="flex min-h-full items-end justify-center p-3 sm:items-center">
            <div class="relative w-full max-w-lg rounded-2xl border border-gray-200 bg-white shadow-xl dark:border-gray-700 dark:bg-gray-800">
                <div class="flex items-start justify-between gap-3 border-b border-gray-200 px-5 py-4 dark:border-gray-700">
                    <div>
                        <p class="text-xs font-bold uppercase tracking-wide text-amber-600 dark:text-amber-300">Hacer promo</p>
                        <h3 id="gastro-promo-titulo" class="text-lg font-bold text-gray-900 dark:text-white" data-promo-producto-nombre></h3>
                    </div>
                    <button type="button" data-promo-cerrar class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200" aria-label="Cerrar">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>

                <div class="space-y-4 px-5 py-5">
                    <div data-promo-paso="elegir" class="grid gap-3 sm:grid-cols-2">
                        <button type="button" data-promo-ir="promo" class="gastro-choice-card">
                            <i class="fas fa-tags"></i>
                            <span class="font-bold">Promo sobre este producto</span>
                            <span class="text-xs font-medium">2x1, 3x2, descuento o precio especial</span>
                        </button>
                        <button type="button" data-promo-ir="combo" class="gastro-choice-card">
                            <i class="fas fa-layer-group"></i>
                            <span class="font-bold">Armar un combo</span>
                            <span class="text-xs font-medium">Juntalo con otros productos a un precio</span>
                        </button>
                    </div>

                    {% include "gastronomia/_menu_promo_rapida_form.html" %}
                    {% include "gastronomia/_menu_combo_form.html" %}

                    <p data-promo-error class="hidden rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm font-semibold text-red-800 dark:border-red-400/30 dark:bg-red-500/10 dark:text-red-200"></p>
                </div>
            </div>
        </div>
    </div>
</div>
