<div x-show="ayudaKpiOpen" class="fixed inset-0 z-50 overflow-y-auto" style="display: none;">
    <div class="fixed inset-0 bg-gray-900/60" @click="cerrarAyudaKpi()"></div>
    <div class="flex min-h-full items-center justify-center p-4">
        <div x-show="ayudaKpiOpen" x-transition
            role="dialog" aria-modal="true" aria-labelledby="ayuda-kpi-titulo"
            class="relative w-full max-w-md rounded-2xl bg-white dark:bg-gray-800 shadow-2xl border border-gray-200 dark:border-gray-700 overflow-hidden">
            <div class="px-5 py-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between gap-4">
                <h3 id="ayuda-kpi-titulo" class="text-lg font-semibold text-gray-900 dark:text-white"
                    x-text="ayudaKpiTitulo"></h3>
                <button type="button" @click="cerrarAyudaKpi()"
                    class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-400/40 rounded-lg p-2"
                    aria-label="Cerrar explicación">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="px-5 py-4">
                <p class="text-sm font-semibold text-gray-800 dark:text-gray-100" x-text="ayudaKpiResumen"></p>
                <p class="mt-2 text-sm text-gray-600 dark:text-gray-300" x-text="ayudaKpiAclaracion"></p>
                <p x-show="ayudaKpiFormula" class="mt-3 rounded-lg bg-gray-100 dark:bg-gray-900 px-3 py-2 text-xs font-bold text-gray-700 dark:text-gray-200"
                    x-text="ayudaKpiFormula"></p>
            </div>
        </div>
    </div>
</div>
