<script>
function peluqueriaTurnoRapido(config) {
    return {
        ...peluqueriaTurnoRapidoEstilos(),
        clientesUrl: config.clientesUrl || '',
        ocupadosUrl: config.ocupadosUrl || '',
        profesionales: Array.isArray(config.profesionales) ? config.profesionales : [],
        catalogo: Array.isArray(config.catalogo) ? config.catalogo : [],
        tiposBase: Array.isArray(config.tiposBase) ? config.tiposBase : [],
        horarios: Array.isArray(config.horarios) ? config.horarios : [],
        intervalo: Number(config.intervalo || 30),
        puedeCrearCliente: !!config.puedeCrearCliente,
        profesionalId: '',
        servicioSel: null,
        opcionId: '',
        servicioPersonalizado: '',
        usarPrecioManual: false,
        precioManual: '',
        duracion: 30,
        fecha: '',
        hora: '',
        ocupados: [],
        cargandoOcupados: false,
        ocupadosFetchId: 0,
        clienteSeleccionado: null,
        clienteId: '',
        clienteBusqueda: '',
        crearClienteNuevo: false,
        clienteNuevoNombre: '',
        clienteNuevoTelefono: '',
        clientes: [],
        mostrarClientes: false,
        cargandoClientes: false,
        clienteFetchId: 0,
        observaciones: '',
        init() {
            this.actualizarModoTema();
            this.inicializarObservadorTema();
            this.fecha = this.hoy();
            if (this.profesionales.length) this.seleccionarProfesional(this.profesionales[0]);
            peluqueriaTurnoRapidoAplicarInicial(this, config.inicial);
            this.$watch('profesionalId', () => this.cargarOcupados());
            this.$watch('fecha', () => this.cargarOcupados());
            this.$watch('duracion', () => this.descartarHoraNoDisponible());
            this.cargarOcupados();
        },
        seleccionarProfesional(profesional) {
            this.profesionalId = profesional ? profesional.id : '';
        },
        profesionalNombre() {
            const profesional = this.profesionales.find((item) => item.id === this.profesionalId);
            return profesional ? profesional.nombre : 'Sin profesional';
        },

        // --- Servicio: botones del catálogo (o tipos fijos si el catálogo está vacío) ---
        modoCatalogo() {
            return this.catalogo.length > 0;
        },
        serviciosVisibles() {
            return this.modoCatalogo() ? this.catalogo : this.tiposBase;
        },
        esServicioSeleccionado(servicio) {
            return !!(servicio && this.servicioSel && this.servicioSel.id === servicio.id);
        },
        seleccionarServicio(servicio) {
            if (!servicio) return;
            this.servicioSel = servicio;
            this.duracion = Number(servicio.duracion || 30);
            const opciones = this.opcionesServicio();
            this.opcionId = opciones.length === 1 ? String(opciones[0].id) : '';
            this.usarPrecioManual = false;
            this.precioManual = '';
        },
        opcionesServicio() {
            return this.servicioSel && Array.isArray(this.servicioSel.opciones) ? this.servicioSel.opciones : [];
        },
        opcionSeleccionada() {
            return this.opcionesServicio().find((item) => String(item.id) === String(this.opcionId)) || null;
        },
        seleccionarOpcion(opcion) {
            this.opcionId = opcion ? String(opcion.id) : '';
        },
        detalleBotonServicio(servicio) {
            const opciones = Array.isArray(servicio.opciones) ? servicio.opciones : [];
            if (opciones.length > 1) return `${opciones.length} opciones`;
            if (opciones.length === 1) return opciones[0].precio_label;
            return servicio.precio_label || (this.modoCatalogo() ? 'Sin precio' : '');
        },
        esServicioLibre() {
            return !this.modoCatalogo() && !!this.servicioSel && this.servicioSel.id === 'otro';
        },
        nombreServicio() {
            if (!this.servicioSel) return 'Turno';
            if (this.esServicioLibre() && this.servicioPersonalizado.trim()) return this.servicioPersonalizado.trim();
            const base = this.servicioSel.nombre || 'Turno';
            const opcion = this.opcionSeleccionada();
            if (!opcion || !opcion.etiqueta) return base;
            return opcion.etiqueta.toLowerCase().startsWith(base.toLowerCase()) ? opcion.etiqueta : `${base} - ${opcion.etiqueta}`;
        },
        servicioTurnoIdFormValue() {
            if (!this.servicioSel) return '';
            return this.modoCatalogo() ? (this.servicioSel.tipo || '') : this.servicioSel.id;
        },
        servicioCatalogoIdFormValue() {
            return this.modoCatalogo() && this.servicioSel ? String(this.servicioSel.id) : '';
        },
        opcionIdFormValue() {
            return this.opcionSeleccionada() ? String(this.opcionId) : '';
        },

        // --- Precio ---
        precioServicio() {
            const opcion = this.opcionSeleccionada();
            if (opcion) return Number(opcion.precio || 0);
            return this.modoCatalogo() && this.servicioSel ? Number(this.servicioSel.precio || 0) : 0;
        },
        precioServicioLabel() {
            const opcion = this.opcionSeleccionada();
            if (opcion) return opcion.precio_label;
            return this.servicioSel && this.servicioSel.precio_label ? this.servicioSel.precio_label : '';
        },
        precioManualValido() {
            return Number(this.precioManual || 0) > 0;
        },
        precioManualFormValue() {
            return this.usarPrecioManual && this.precioManualValido() ? String(Number(this.precioManual)) : '';
        },
        alternarPrecioManual() {
            this.usarPrecioManual = !this.usarPrecioManual;
            if (!this.usarPrecioManual) this.precioManual = '';
        },
        precioResumen() {
            if (this.usarPrecioManual && this.precioManualValido()) return Number(this.precioManual).toLocaleString();
            return this.precioServicioLabel() || 'Sin precio';
        },

        // --- Hora: grilla con horarios ocupados y pasados ---
        hoy() {
            return this.formatearFecha(new Date());
        },
        aMinutos(hora) {
            const [h, m] = String(hora || '').split(':').map(Number);
            return Number.isFinite(h) && Number.isFinite(m) ? (h * 60) + m : null;
        },
        horaPasada(hora) {
            if (this.fecha !== this.hoy()) return false;
            const ahora = new Date();
            return this.aMinutos(hora) < (ahora.getHours() * 60) + ahora.getMinutes();
        },
        horaOcupada(hora) {
            const inicio = this.aMinutos(hora);
            if (inicio === null) return false;
            const fin = inicio + Number(this.duracion || 30);
            return this.ocupados.some((rango) => inicio < rango.fin && fin > rango.inicio);
        },
        horasVisibles() {
            return this.horarios.filter((hora) => !this.horaPasada(hora));
        },
        seleccionarHora(hora) {
            if (this.horaOcupada(hora)) return;
            this.hora = hora;
        },
        descartarHoraNoDisponible() {
            if (this.hora && (this.horaOcupada(this.hora) || this.horaPasada(this.hora))) this.hora = '';
        },
        async cargarOcupados() {
            const fetchId = ++this.ocupadosFetchId;
            if (!this.ocupadosUrl || !this.profesionalId || !this.fecha) {
                this.ocupados = [];
                this.cargandoOcupados = false;
                return;
            }
            this.cargandoOcupados = true;
            try {
                const url = new URL(this.ocupadosUrl, window.location.origin);
                url.searchParams.set('profesional_id', this.profesionalId);
                url.searchParams.set('fecha', this.fecha);
                const response = await fetch(url.toString(), { headers: { 'Accept': 'application/json' } });
                const data = response.ok ? await response.json() : {};
                if (fetchId !== this.ocupadosFetchId) return;
                this.ocupados = Array.isArray(data.ocupados) ? data.ocupados : [];
                this.descartarHoraNoDisponible();
            } catch (_error) {
                if (fetchId === this.ocupadosFetchId) this.ocupados = [];
            } finally {
                if (fetchId === this.ocupadosFetchId) this.cargandoOcupados = false;
            }
        },

        // --- Validaciones y textos del resumen ---
        puedeCrearTurno() {
            return !!this.servicioSel
                && (!this.opcionesServicio().length || !!this.opcionSeleccionada())
                && !!this.hora
                && !this.horaOcupada(this.hora);
        },
        mensajeTurnoNoDisponible() {
            if (!this.servicioSel) return 'Elegí un servicio.';
            if (this.opcionesServicio().length && !this.opcionSeleccionada()) return 'Elegí el tipo de servicio.';
            if (!this.hora) return 'Elegí una hora libre.';
            if (this.horaOcupada(this.hora)) return 'Esa hora ya está ocupada para este profesional.';
            return 'Completá los datos del turno.';
        },
        puedeCrearYCobrar() {
            if (!this.modoCatalogo() || !this.puedeCrearTurno()) return false;
            return this.usarPrecioManual ? this.precioManualValido() : this.precioServicio() > 0;
        },
        mensajeCobroNoDisponible() {
            if (!this.puedeCrearTurno()) return this.mensajeTurnoNoDisponible();
            if (!this.modoCatalogo()) return 'Cargá tus servicios para cobrar desde acá.';
            if (this.usarPrecioManual) return 'Escribí el precio a cobrar.';
            return 'Este servicio no tiene precio: tocá "Cambiar precio".';
        },
        tituloTurno() {
            const nombreCliente = this.clienteNombreTurno();
            return nombreCliente ? `${this.nombreServicio()} - ${nombreCliente}` : this.nombreServicio();
        },
        descripcionTurno() {
            return `Turno peluquería/barbería: ${this.nombreServicio()} con ${this.profesionalNombre()}.`;
        },
        get fechaInicio() {
            return this.fecha && this.hora ? `${this.fecha}T${this.hora}` : '';
        },
        get fechaFin() {
            if (!this.fechaInicio) return '';
            const fin = new Date(this.fechaInicio);
            fin.setMinutes(fin.getMinutes() + Number(this.duracion || 30));
            return this.formatearDatetimeLocal(fin);
        },
        horarioResumen() {
            if (!this.fecha || !this.hora) return 'Elegí una hora';
            return `${this.fecha} ${this.hora} a ${this.fechaFin.slice(11, 16)}`;
        },
        formatearFecha(fecha) {
            return `${fecha.getFullYear()}-${String(fecha.getMonth() + 1).padStart(2, '0')}-${String(fecha.getDate()).padStart(2, '0')}`;
        },
        formatearDatetimeLocal(fecha) {
            return `${this.formatearFecha(fecha)}T${String(fecha.getHours()).padStart(2, '0')}:${String(fecha.getMinutes()).padStart(2, '0')}`;
        },

        // --- Cliente ---
        detalleCliente(cliente) {
            if (!cliente) return '';
            return [cliente.ruc_ci, cliente.telefono, cliente.email].filter(Boolean).join(' · ') || 'Sin datos extra';
        },
        limpiarCliente() {
            this.clienteSeleccionado = null;
            this.clienteId = '';
            this.clienteBusqueda = '';
            this.cancelarClienteNuevo();
        },
        seleccionarCliente(cliente) {
            this.clienteSeleccionado = cliente;
            this.clienteId = cliente ? cliente.id_cliente : '';
            this.clienteBusqueda = '';
            this.cancelarClienteNuevo();
            this.clientes = [];
            this.mostrarClientes = false;
        },
        puedePrepararClienteNuevo() {
            return this.puedeCrearCliente && !this.clienteSeleccionado && !this.crearClienteNuevo && this.clienteBusqueda.trim().length >= 2;
        },
        prepararClienteNuevo() {
            if (!this.puedePrepararClienteNuevo()) return;
            this.clienteNuevoNombre = this.clienteBusqueda.trim();
            this.clienteNuevoTelefono = '';
            this.crearClienteNuevo = true;
            this.mostrarClientes = false;
            this.clientes = [];
        },
        cancelarClienteNuevo() {
            this.crearClienteNuevo = false;
            this.clienteNuevoNombre = '';
            this.clienteNuevoTelefono = '';
        },
        clienteNombreTurno() {
            if (this.clienteSeleccionado) return this.clienteSeleccionado.nombre;
            if (this.crearClienteNuevo && this.clienteNuevoNombre.trim()) return this.clienteNuevoNombre.trim();
            return '';
        },
        clienteNuevoNombreFormValue() {
            return this.crearClienteNuevo ? this.clienteNuevoNombre.trim() : '';
        },
        clienteNuevoTelefonoFormValue() {
            return this.crearClienteNuevo ? this.clienteNuevoTelefono.trim() : '';
        },
        async buscarClientes(query = '', abrir = false) {
            if (abrir) this.mostrarClientes = true;
            const fetchId = ++this.clienteFetchId;
            this.cargandoClientes = true;
            try {
                const url = new URL(this.clientesUrl, window.location.origin);
                if ((query || '').trim()) url.searchParams.set('q', query.trim());
                const response = await fetch(url.toString(), { headers: { 'Accept': 'application/json' } });
                const data = await response.json();
                if (fetchId === this.clienteFetchId) this.clientes = Array.isArray(data.items) ? data.items : [];
            } catch (_error) {
                if (fetchId === this.clienteFetchId) this.clientes = [];
            } finally {
                if (fetchId === this.clienteFetchId) this.cargandoClientes = false;
            }
        },
    };
}
</script>
