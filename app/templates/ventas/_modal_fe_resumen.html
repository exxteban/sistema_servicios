{# Factura electronica en el modal de detalle de venta (Historial y reporte del
   dia). Los datos salen de `datos_fe_modal`; las acciones estan en el panel de
   la venta (/ventas/<id>). #}
<div class="mb-4 rounded-lg border border-teal-200 dark:border-teal-900 px-3 py-2" x-show="venta?.fe?.numero">
    <p class="text-xs text-gray-500 dark:text-gray-400">Factura electrónica</p>
    <p class="text-sm font-semibold text-gray-800 dark:text-gray-100">
        <span class="font-mono" x-text="venta?.fe?.numero"></span>
        <span class="text-xs font-normal text-gray-500 dark:text-gray-400" x-text="venta?.fe?.estado"></span>
    </p>
    <template x-if="venta?.fe?.puede_corregir_rechazo">
        <div class="mt-2 space-y-1">
            <p class="text-xs font-semibold text-red-700 dark:text-red-300">SIFEN rechazó la factura</p>
            <p class="text-xs text-gray-700 dark:text-gray-200" x-text="venta.fe.motivo_rechazo"></p>
            <a :href="'/ventas/' + venta.id" class="text-xs font-medium text-emerald-700 dark:text-emerald-300 underline">
                Corregir y reenviar desde la venta (sale con el mismo número)
            </a>
        </div>
    </template>
</div>
