{% extends "base.html" %}

{% block title %}Sin permiso{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg py-16 text-center">
    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-3xl bg-rose-50 text-2xl text-rose-600 dark:bg-rose-500/15 dark:text-rose-300">
        <i class="fas fa-lock"></i>
    </div>
    <h1 class="mt-5 text-2xl font-black text-slate-950 dark:text-white">Sin permiso</h1>
    <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">{{ mensaje or 'No tienes permiso para ver esta sección.' }}</p>
    <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">Si lo necesitás, pedile acceso a un administrador.</p>
    <a href="{{ url_for('main.dashboard') }}"
       data-tab-url="{{ url_for('main.dashboard') }}"
       data-tab-title="Dashboard"
       class="app-tab-link mt-6 inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-50 dark:border-white/10 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-white/5">
        <i class="fas fa-arrow-left text-xs"></i> Volver al dashboard
    </a>
</div>
{% endblock %}
